name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi

      # -count=1 defeats the test cache: a green run here has to mean the tests
      # ran, not that they ran once on someone's laptop a week ago.
      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        run: |
          {
            echo '### Coverage'
            echo '```'
            go tool cover -func=coverage.out | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The load-bearing tests get their own gate: the property tests that make
  # "cleaning is lossless" a checked claim rather than a sentence in the README,
  # plus the three that stop `augur upgrade` installing bytes it did not verify.
  # Both are promises about not damaging something the user already has.
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Clean/scan invariants
        run: |
          set -o pipefail
          go test -count=1 -v \
            -run 'TestCleanIsIdentityOnEmptySelection|TestCleanRemovesExactlyWhatWasSelected|TestCleanIsIdempotent|TestCleanImageIsIdentityOnEmptySelection|TestVisibleTextSurvivesCleaning|TestUnselectedFindingsAreLeftAlone|TestImageCleanIsLossless|TestSaveLeavesTheOriginalAlone|TestVerificationChecksTheBytesOnDisk|TestVerifyChecksumRejectsTampering|TestExtractBinaryPicksTheBinaryNotTheLicense|TestRunRefusesATamperedDownload' \
            ./internal/scan/ ./internal/session/ ./internal/upgrade/ | tee invariants.log

          # `go test -run` exits 0 when the pattern matches nothing, so a typo in
          # the regex above would turn this gate green while testing nothing at
          # all. That is a worse outcome than having no gate, so fail on it.
          if grep -q 'no tests to run' invariants.log; then
            echo "::error::the -run pattern matched no tests in at least one package"
            exit 1
          fi

          # And a floor on how many actually ran, so deleting an invariant test
          # has to be a deliberate edit here rather than a silent reduction.
          passed="$(grep -c '^--- PASS' invariants.log)"
          echo "invariant tests passed: $passed"
          [ "$passed" -ge 12 ]

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned rather than `latest`: with `latest` the linter is whatever
          # shipped that morning, so an unrelated PR can go red on a new check
          # its author never touched. Bump this deliberately.
          version: v2.12.2

  # ENFORCING. The architecture declared in enola-intent.yaml, graded against the
  # merge base.
  #
  # fail-on: layers,intent — two policies, for two different kinds of drift.
  #
  #   layers  a package that starts depending outwards. Declared rather than
  #           inferred, so it verdicts at 1.00 and --fail-on alone enforces it.
  #           Not `cycles`: this is Go, and the compiler already refuses import
  #           cycles between packages. The layer order is the part it cannot
  #           check — nothing stops internal/detect importing internal/scan
  #           today except this gate.
  #
  #   intent  the decision pages in docs/decisions/ carry anchors into the code
  #           they govern. When that code moves or dies, the anchor dangles and
  #           this fails — which is the only mechanism that keeps a decision
  #           document from quietly becoming fiction. A stale doc is worse than
  #           no doc, because it is still believed.
  architecture:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # merge-base needs history; a depth-1 clone has none

      - name: Resolve the merge base
        id: base
        run: |
          # actions/checkout leaves a PR on a merge ref, so origin/<base> is not
          # guaranteed to be present. Fetch it explicitly.
          git fetch --no-tags --quiet origin \
            "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          echo "sha=$(git merge-base HEAD "origin/${{ github.base_ref }}")" >> "$GITHUB_OUTPUT"

      - uses: enola-labs/enola-action@v2
        with:
          config: mcp-arch.yaml
          base-sha: ${{ steps.base.outputs.sha }}
          fail-on: layers,intent
          # Load-bearing, and NOT a loosening. The default floor is 1.00, and a
          # dangling code anchor verdicts at 0.80 — so `fail-on: intent` on its
          # own is a policy that never grades the finding it exists for. This
          # gate was silently green until it was checked against a deliberately
          # broken anchor.
          #
          # `layers` is unaffected: a declared order verdicts at 1.00, and the
          # inferred go-standard pattern enola also reports is descriptive and
          # never graded.
          min-confidence: "0.8"

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
