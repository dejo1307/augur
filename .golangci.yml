version: "2"

# The baseline is clean, so CI gates the whole tree: any new finding fails the
# build. Keeping it that way is cheaper than triaging a backlog later.
linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - copyloopvar
    - misspell
    - unconvert
    - usestdlibvars

  settings:
    misspell:
      # The prose in this repo is British ("recognised", "individualised") and
      # the linter would otherwise flag every comment in it.
      locale: UK
    staticcheck:
      checks:
        - all
        # ST1000: package comments are required here by review, not by a linter
        # that also wants them phrased "Package x ...". Ours say more than that.
        - -ST1000

  exclusions:
    generated: lax
    rules:
      # Test fixtures deliberately assemble malformed containers and unusual
      # text; the interesting failure is the assertion, not an unchecked helper.
      - path: _test\.go
        linters:
          - errcheck

      # Packages that NARRATE to a terminal: diagnostics, progress lines, the
      # "==> Downloading ..." running commentary. There is no recovery from a
      # failed write to a terminal that is already gone, and the alternative —
      # reporting that we could not report — is noise.
      #
      # The distinction being drawn, and the reason this is a path list rather
      # than a blanket exclusion of fmt.Fprintf: a package that writes the
      # PAYLOAD does check its writes. report.Text returns a write error through
      # the errWriter in internal/report, because a truncated report is a wrong
      # answer, whereas a truncated progress message is only a quiet one.
      - path: internal/cli/
        linters:
          - errcheck
      - path: internal/upgrade/
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
